name: tag

# Manual only: never triggered by a push or a pull request
on:
  workflow_dispatch:
    inputs:
      bump:
        description: Which part of the version to increment
        type: choice
        options: [patch, minor, major]
        default: patch

jobs:
  tag:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # tags are needed to find the latest version

      - name: Create the next semver tag
        env:
          BUMP: ${{ inputs.bump }}
        run: |
          set -euo pipefail

          # Only plain semver tags are candidates: anything else (rc, dated
          # tags, ...) must not decide what the next version is.
          # --sort=-v:refname orders them by version, so head -n1 is the latest.
          latest=$(git tag -l '[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -n1)

          if [[ -z "$latest" ]]; then
            next="1.0.0"
          else
            IFS=. read -r major minor patch <<< "$latest"
            case "$BUMP" in
              major) next="$((major + 1)).0.0" ;;
              minor) next="${major}.$((minor + 1)).0" ;;
              patch) next="${major}.${minor}.$((patch + 1))" ;;
            esac
          fi

          echo "latest tag: ${latest:-<none>} -> new tag: $next"
          git tag "$next" "$GITHUB_SHA"
          git push origin "$next"
          echo "### New tag \`$next\`" >> "$GITHUB_STEP_SUMMARY"
