name: test

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      # pyproject.toml pins requires-python to "==3.14.0": let uv provide that
      # interpreter instead of actions/setup-python
      - name: Install Python
        run: uv python install

      - name: Linter and tests
        run: ./shMakefile test
